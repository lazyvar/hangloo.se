<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="preload" as="font" type="font/woff2" crossorigin href="/fonts/catamaran-latin.woff2">
  <link rel="icon" href="/icon.png">
  <link rel="stylesheet" href="/clock.css">
  <link rel="stylesheet" href="/syntax.css">
  <title>&#65279;</title>
  <style>
    @font-face {
      font-family: 'Catamaran';
      font-style: normal;
      font-weight: 100 900;
      font-display: swap;
      src: url('/fonts/catamaran-latin.woff2') format('woff2');
      unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
    }
    @font-face {
      font-family: 'Catamaran';
      font-style: normal;
      font-weight: 100 900;
      font-display: swap;
      src: url('/fonts/catamaran-latin-ext.woff2') format('woff2');
      unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;
    }
    @font-face {
      font-family: 'Fira Code';
      font-style: normal;
      font-weight: 300 700;
      font-display: swap;
      src: url('/fonts/firacode-latin.woff2') format('woff2');
      unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
    }
    @font-face {
      font-family: 'Fira Code';
      font-style: normal;
      font-weight: 300 700;
      font-display: swap;
      src: url('/fonts/firacode-latin-ext.woff2') format('woff2');
      unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;
    }
    :root {
      --bg: #f4f1ea;
      --surface: #fffdf9;
      --ink: #2a2521;
      --muted: #9a9183;
      --accent: #cf5c36;
      --accent-strong: #b04a28;
      --hairline: #e6e0d4;
      --code-chip: #f0ebe0;
      --radius: 8px;
      --measure: 680px;
      --mono: 'Fira Code', ui-monospace, SFMono-Regular, Menlo, monospace;
    }

    * { box-sizing: border-box; }

    body {
      font-family: 'Catamaran', 'Helvetica', sans-serif;
      background: var(--bg);
      color: var(--ink);
      margin: 25px auto 0;
      max-width: 8.5in;
      padding: 20px;
      display: flex;
      flex-direction: column;
      line-height: 1.65;
      font-size: 17px;
      text-align: justify;
      hyphens: auto;
      -webkit-hyphens: auto;
    }

    code, pre, kbd, samp { font-family: var(--mono); }

    a {
      color: var(--accent);
      text-decoration: none;
      background-image: linear-gradient(var(--accent-strong), var(--accent-strong));
      background-repeat: no-repeat;
      background-position: 0 100%;
      background-size: 0 1.5px;
      transition: background-size .2s ease, color .15s ease;
    }
    a:hover {
      color: var(--accent-strong);
      background-size: 100% 1.5px;
    }

     
    header {
      display: flex;
      flex-direction: row;
      justify-content: space-between;
      align-items: flex-start;
      padding-bottom: 4px;
    }
    .all-links { margin-top: auto; margin-bottom: auto; }
    .wordmark {
      font-size: 1.25rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      color: var(--ink);
      background-image: none;
    }
    .wordmark:hover { color: var(--ink); }
    .sub-links {
      margin-top: 12px;
      display: flex;
      gap: 16px;
      font-size: 0.95rem;
    }
    .sub-links a { color: var(--muted); background-image: none; }
    .sub-links a:hover,
    .sub-links a.active { color: var(--accent); }

     
    .find {
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--surface);
      border: 1px solid var(--hairline);
      padding: 8px 14px;
      margin-top: 8px;
      border-radius: 999px;
      cursor: pointer;
      transition: border-color .2s ease;
    }
    .find:hover { border-color: var(--accent); }
    .find svg { stroke: var(--muted); display: block; }
    .find:hover svg { stroke: var(--accent); }

     
    main {
      margin-top: 16px;
      padding: 28px 32px;
      border-radius: var(--radius);
      background: var(--surface);
    }
    main h1 {
      text-align: left;
      font-size: 2rem;
      line-height: 1.2;
      font-weight: 800;
      letter-spacing: -0.02em;
      margin: 0.2em 0 0.1em;
    }
    article { max-width: var(--measure); }
    article h2, article h3 {
      text-align: left;
      line-height: 1.25;
      letter-spacing: -0.015em;
      margin-top: 1.6em;
      margin-bottom: 0.4em;
    }
    article h2 { font-size: 1.4rem; }
    article h3 { font-size: 1.15rem; }
    article p { margin: 0.9em 0; }
    article ul, article ol { padding-left: 1.4em; }
    article li { margin: 0.3em 0; }
    article hr {
      border: none;
      border-top: 1px solid var(--hairline);
      margin: 2em 0;
    }
    article img { max-width: 100%; height: auto; border-radius: var(--radius); }

     
    code {
      background: var(--code-chip);
      padding: 0.12em 0.4em;
      border-radius: 4px;
      font-size: 0.88em;
    }
    pre {
      padding: 16px 18px;
      border-radius: var(--radius);
      overflow-x: auto;
      line-height: 1.5;
    }
    pre code { background: none; padding: 0; font-size: 0.85em; }

     
    blockquote {
      border-left: 3px solid var(--accent);
      padding: 0 0 0 1.4em;
      margin: 1.2em 0;
      color: var(--muted);
      font-style: italic;
    }

     
    .post-meta {
      font-family: var(--mono);
      font-size: 0.78rem;
      color: var(--muted);
      text-align: left;
      margin-bottom: 1.4em;
    }

     
    .post-list-item {
      display: flex;
      gap: 16px;
      align-items: baseline;
      padding: 12px 0;
      border-bottom: 1px solid var(--hairline);
      text-align: left;
    }
    .post-list-item:last-child { border-bottom: none; }
    .post-list-item .date {
      font-family: var(--mono);
      font-size: 0.78rem;
      color: var(--muted);
      white-space: nowrap;
    }
    .post-list-item .title { font-size: 1.05rem; }
  </style>
</head>

<body>
  
  <header>
    <div class="all-links">
      <a class="wordmark" href="/">🤙 hangloo.se</a>
      <div class="sub-links">
        <a href="/pensieve">/pensieve</a>
        <a href="/about">/about</a>
        <a href="https://mack.cloud">/author</a>
      </div>
    </div>
    <div class="clock-container">
      <div class="clock">
        <div class="hours-container">
          <div class="hours angled"></div>
        </div>
        <div class="minutes-container">
          <div class="minutes angled"></div>
        </div>
        <div class="seconds-container">
          <div class="seconds"></div>
        </div>
      </div>
    </div>
  </header>
  <div class="find">
    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="darkgray" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="11" cy="11" r="8"></circle>
      <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
    </svg>
  </div>
  
  
<main>
  <h1>Tags</h1>
  
</main>

  
  
  <script type="text/javascript" src="/hello_world.js"></script>
  <script type="text/javascript" src="/clock.js"></script>
</body>

</html>
